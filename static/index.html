<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LLM Lab · Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0d0f12; --bg-secondary: #13161b; --bg-input: #1a1e25;
      --border: #252a34; --accent: #00e5a0; --accent-dim: #00e5a020;
      --text-primary: #e8eaf0; --text-secondary: #6b7280; --text-code: #a3e635;
      --user-bg: #1e2433; --model-bg: #13161b; --font-ui: 'DM Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace; --radius: 10px; --transition: 0.2s ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-ui); font-size: 15px; }
    .app { display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 260px; min-width: 260px; background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 16px; gap: 24px; }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 32px; height: 32px; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--accent); font-family: var(--font-mono); }
    .logo-text { font-size: 13px; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; }
    .logo-text span { display: block; font-size: 15px; color: var(--text-primary); text-transform: none; }
    .model-section label, .params-section label { display: block; font-size: 11px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 10px; }
    #model-select { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-mono); padding: 10px; cursor: pointer; outline: none; }
    .model-badge { margin-top: 10px; padding: 8px; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: var(--radius); font-size: 11px; font-family: var(--font-mono); color: var(--accent); display: flex; align-items: center; gap: 6px; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .params-section { display: flex; flex-direction: column; gap: 14px; }
    .param-row { display: flex; align-items: center; gap: 10px; }
    .param-row span { font-family: var(--font-mono); font-size: 11px; color: var(--accent); min-width: 32px; text-align: right; }
    input[type="range"] { flex: 1; height: 3px; -webkit-appearance: none; background: var(--border); outline: none; cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
    .token-info { margin-top: auto; padding: 12px; background: var(--bg-input); border-radius: var(--radius); border: 1px solid var(--border); font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); }
    .token-count { font-size: 22px; color: var(--text-primary); }
    .chat-area { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 18px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; background: var(--bg-secondary); }
    .chat-title { font-size: 13px; color: var(--text-secondary); font-family: var(--font-mono); }
    #clear-btn { background: none; border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
    #messages { flex: 1; overflow-y: auto; padding: 24px 0; display: flex; flex-direction: column; gap: 2px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px; color: var(--text-secondary); text-align: center; }
    .message { padding: 16px 28px; display: flex; gap: 14px; align-items: flex-start; }
    .message.user { background: var(--user-bg); }
    .message.model { background: var(--model-bg); }
    .msg-avatar { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: var(--font-mono); font-weight: 500; }
    .message.user .msg-avatar { background: #2d3748; color: var(--text-secondary); }
    .message.model .msg-avatar { background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); }
    .msg-content { flex: 1; font-size: 14px; line-height: 1.75; }
    .msg-role { font-size: 10px; text-transform: uppercase; font-weight: 500; margin-bottom: 6px; }
    .message.user .msg-role { color: var(--text-secondary); }
    .message.model .msg-role { color: var(--accent); }
    .msg-text { white-space: pre-wrap; word-break: break-word; }
    .input-area { padding: 16px 24px 20px; background: var(--bg-secondary); border-top: 1px solid var(--border); }
    .input-wrapper { display: flex; align-items: flex-end; gap: 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 10px 10px 16px; }
    #user-input { flex: 1; background: none; border: none; outline: none; color: var(--text-primary); resize: none; font-size: 14px; max-height: 180px; }
    #send-btn { width: 36px; height: 36px; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #send-btn svg { width: 16px; height: 16px; stroke: #0d0f12; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #3d1515; border: 1px solid #7f3a3a; color: #ffb3b3; padding: 10px 20px; border-radius: var(--radius); opacity: 0; transition: 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">&gt;_</div>
      <div class="logo-text">My LLM<span>Chat Interface</span></div>
    </div>

    <div class="model-section">
      <label for="model-select">Modelo</label>
      <select id="model-select">
        <option value="" disabled selected>A carregar modelos...</option>
      </select>
      <div class="model-badge">
        <div class="badge-dot"></div>
        <span id="active-model-label">A conectar ao servidor...</span>
      </div>
    </div>

    <div class="params-section">
      <label>Parâmetros</label>
      <div>
        <label>Temperatura</label>
        <div class="param-row">
          <input type="range" id="temperature-range" min="0.1" max="1.5" step="0.05" value="0.7">
          <span id="temperature-val">0.7</span>
        </div>
      </div>
      <div>
        <label>Max Tokens</label>
        <div class="param-row">
          <input type="range" id="maxtokens-range" min="20" max="500" step="10" value="150">
          <span id="maxtokens-val">150</span>
        </div>
      </div>
    </div>

    <div class="token-info">
      <div class="token-count" id="last-token-count">—</div>
      <div>tokens na última resposta</div>
    </div>
  </aside>

  <main class="chat-area">
    <header class="chat-header">
      <div class="chat-title">sessão <span id="session-id"></span></div>
      <button id="clear-btn">limpar</button>
    </header>
    <div id="messages">
      <div class="welcome" id="welcome-screen">
        <h2>Laboratório LLM</h2>
        <p>Selecione um modelo e envie a sua primeira mensagem.</p>
      </div>
    </div>
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="user-input" rows="1" placeholder="Digite a sua mensagem..."></textarea>
        <button id="send-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="error-toast"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const elements = {
    modelSelect: document.getElementById('model-select'),
    activeModelLabel: document.getElementById('active-model-label'),
    messages: document.getElementById('messages'),
    userInput: document.getElementById('user-input'),
    sendBtn: document.getElementById('send-btn'),
    clearBtn: document.getElementById('clear-btn'),
    tempRange: document.getElementById('temperature-range'),
    tempVal: document.getElementById('temperature-val'),
    maxTokensRange: document.getElementById('maxtokens-range'),
    maxTokensVal: document.getElementById('maxtokens-val'),
    tokenCount: document.getElementById('last-token-count'),
    welcome: document.getElementById('welcome-screen'),
    toast: document.getElementById('error-toast')
  };

  document.getElementById('session-id').textContent = '#' + Math.random().toString(36).slice(2,6).toUpperCase();
  let isLoading = false;

  async function init() {
    try {
      const res = await fetch('/modelos');
      if (!res.ok) throw new Error('Erro na resposta do servidor');
      const data = await res.json();
      
      elements.modelSelect.innerHTML = '';
      if (data.modelos.length === 0) {
        elements.modelSelect.innerHTML = '<option disabled>Nenhum modelo carregado no Python</option>';
        elements.activeModelLabel.textContent = 'Erro - Servidor vazio';
        return;
      }
      
      data.modelos.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id; opt.textContent = m.nome;
        elements.modelSelect.appendChild(opt);
      });
      atualizarBadge();
    } catch (err) {
      console.error(err);
      elements.modelSelect.innerHTML = '<option disabled>Erro de Conexão</option>';
      elements.activeModelLabel.textContent = 'Falha ao conectar';
    }
  }

  function atualizarBadge() {
    elements.activeModelLabel.textContent = elements.modelSelect.options[elements.modelSelect.selectedIndex]?.textContent || 'Nenhum';
  }

  elements.modelSelect.addEventListener('change', atualizarBadge);
  elements.tempRange.addEventListener('input', e => elements.tempVal.textContent = e.target.value);
  elements.maxTokensRange.addEventListener('input', e => elements.maxTokensVal.textContent = e.target.value);

  async function enviar() {
    if (isLoading || !elements.userInput.value.trim()) return;
    const modelo = elements.modelSelect.value;
    if (!modelo) return mostrarErro("Selecione um modelo!");
    
    const texto = elements.userInput.value.trim();
    if(elements.welcome) elements.welcome.style.display = 'none';
    
    addMsg('user', texto);
    elements.userInput.value = '';
    setLoading(true);
    const loadingId = addMsg('model', 'A pensar...');

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          modelo, mensagem: texto, 
          max_tokens: parseInt(elements.maxTokensRange.value),
          temperatura: parseFloat(elements.tempRange.value)
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Erro no servidor');
      
      updateMsg(loadingId, data.resposta);
      elements.tokenCount.textContent = data.tokens_gerados;
    } catch (err) {
      updateMsg(loadingId, '❌ Erro: ' + err.message);
      mostrarErro(err.message);
    } finally {
      setLoading(false);
    }
  }

  elements.sendBtn.addEventListener('click', enviar);
  elements.userInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }});
  elements.clearBtn.addEventListener('click', () => { elements.messages.innerHTML = ''; elements.messages.appendChild(elements.welcome); elements.welcome.style.display = 'flex'; });

  function addMsg(tipo, texto) {
    const div = document.createElement('div');
    div.className = `message ${tipo}`;
    const id = 'msg-' + Date.now();
    div.id = id;
    div.innerHTML = `<div class="msg-avatar">${tipo==='user'?'EU':'AI'}</div><div class="msg-content"><div class="msg-role">${tipo==='user'?'Você':'Modelo'}</div><div class="msg-text">${texto}</div></div>`;
    elements.messages.appendChild(div);
    elements.messages.scrollTop = elements.messages.scrollHeight;
    return id;
  }

  function updateMsg(id, texto) { document.querySelector(`#${id} .msg-text`).textContent = texto; }
  function setLoading(state) { isLoading = state; elements.sendBtn.disabled = state; elements.userInput.disabled = state; }
  function mostrarErro(msg) { elements.toast.textContent = msg; elements.toast.classList.add('show'); setTimeout(() => elements.toast.classList.remove('show'), 3000); }

  init();
});
</script>
</body>
</html>
